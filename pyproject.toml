[project]
name = "test-hr-notes"
version = "0.1.0"
description = "Foundry hosted MAF notes agent for giomem3392/test_hr"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
pretty = true
