# Portable harness snippet: copy into any GioBot-orchestrated repo.
# Fail-closed on TruffleHog *verified* findings. Not product-specific.
#
# If a verified secret is found: rotate/revoke the credential immediately,
# purge it from git history if needed, then re-run. To skip known-safe
# fixtures, add path filters via extra_args (e.g. --exclude-paths=...) —
# never disable --fail for convenience.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified, fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        # Action SHA pinned to release v3.97.0; scanner image also digest-pinned.
        # The composite action already passes --fail; we restrict to verified.
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: .
          version: 3.97.0@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33
          extra_args: --results=verified
