name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/**]

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/notes-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.6" "mypy==2.3.1" "pydantic>=2.0" "pytest>=8.0"

      - name: Ruff lint
        working-directory: .
        run: ruff check src tests

      - name: Ruff format check
        working-directory: .
        run: ruff format --check src tests

      - name: Mypy
        run: mypy notes.py main.py

      - name: Pytest
        working-directory: .
        run: pytest -q
